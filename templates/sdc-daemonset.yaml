apiVersion: v1
kind: Namespace
metadata:
  name: powerflex-sdc
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flatcar-sdc
  namespace: powerflex-sdc
spec:
  selector:
    matchLabels:
      app: flatcar-sdc
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app: flatcar-sdc
    spec:
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_NODE_NAME
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      initContainers:
      - name: sdc
        image: quay.io/dell/storage/powerflex/sdc:5.0@sha256:1436844390ea95507bf0a24c68a300a355f010a90ed654a42a1f091482b6a0fc
        securityContext:
          privileged: true
        env:
        - name: MODULE_SIGCHECK
          value: '0'
        - name: NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MODE
          value: config
        - name: MDM
          value: ''
        - name: HOST_DRV_CFG_PATH
          value: /opt/emc/scaleio/sdc/bin
        volumeMounts:
        - name: kernel-modules
          mountPath: /lib/modules
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: os-release
          mountPath: /host-os-release
          readOnly: true
        - name: host-opt-emc
          mountPath: /host_opt_emc_path
        - name: storage
          mountPath: /storage
        - name: udev
          mountPath: /rules.d
        - name: drv-cfg
          mountPath: /host_drv_cfg_path
        - name: flatcar-init
          mountPath: /flatcar
          readOnly: true
        command:
        - /bin/bash
        - /flatcar/install.sh
      containers:
      - name: sdc-health
        image: quay.io/dell/storage/powerflex/sdc:5.0@sha256:1436844390ea95507bf0a24c68a300a355f010a90ed654a42a1f091482b6a0fc
        command:
        - /bin/sh
        - -c
        args:
        - trap "exit 0" TERM INT; while :; do sleep 3600 & wait $!; done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 65534
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - grep -qw scini /proc/modules
          initialDelaySeconds: 2
          periodSeconds: 15
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 128Mi
      volumes:
      - name: kernel-modules
        hostPath:
          path: /usr/lib/modules
          type: Directory
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: os-release
        hostPath:
          path: /etc/os-release
          type: File
      - name: host-opt-emc
        hostPath:
          path: /opt/emc
          type: DirectoryOrCreate
      - name: storage
        hostPath:
          path: /var/emc-scaleio
          type: DirectoryOrCreate
      - name: udev
        hostPath:
          path: /etc/udev/rules.d
          type: Directory
      - name: drv-cfg
        hostPath:
          path: /opt/emc/scaleio/sdc/bin
          type: DirectoryOrCreate
      - name: flatcar-init
        configMap:
          name: flatcar-sdc-init
          defaultMode: 365
